name: Build Multi-Platform Executa Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            python_arch: 'x64'
          - os: macos-14
            platform: darwin-arm64
            python_arch: 'arm64'
          - os: macos-13
            platform: darwin-x86_64
            python_arch: 'x64'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller youtube-transcript-api

      - name: Build Executa Binary
        working-directory: executas/clip-studio
        run: |
          pyinstaller --onefile --clean --noupx --name clipstudio-engine clip_studio_plugin.py
          test -f dist/clipstudio-engine

      - name: Smoke Test (describe)
        working-directory: executas/clip-studio
        run: |
          out=$(echo '{"jsonrpc":"2.0","method":"describe","id":1}' | ./dist/clipstudio-engine 2>/dev/null || true)
          echo "describe -> $out"
          echo "$out" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'result' in d; print('Protocol smoke test passed!')"

      - name: Package tar.gz
        working-directory: executas/clip-studio/dist
        run: |
          tar czf "clipstudio-engine-${{ matrix.platform }}.tar.gz" clipstudio-engine
          shasum -a 256 "clipstudio-engine-${{ matrix.platform }}.tar.gz" > "clipstudio-engine-${{ matrix.platform }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: executas/clip-studio/dist/clipstudio-engine-${{ matrix.platform }}.tar.gz*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller youtube-transcript-api

      - name: Build Executa Binary
        working-directory: executas/clip-studio
        run: |
          pyinstaller --onefile --clean --noupx --name clipstudio-engine clip_studio_plugin.py

      - name: Smoke Test (describe)
        working-directory: executas/clip-studio
        run: |
          $inputJson = '{"jsonrpc":"2.0","method":"describe","id":1}'
          $out = $inputJson | .\dist\clipstudio-engine.exe
          Write-Host "describe -> $out"

      - name: Package zip
        working-directory: executas/clip-studio/dist
        run: |
          Compress-Archive -Path clipstudio-engine.exe -DestinationPath clipstudio-engine-windows-x86_64.zip
          $sha = (Get-FileHash clipstudio-engine-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$sha  clipstudio-engine-windows-x86_64.zip" | Out-File -Encoding ascii clipstudio-engine-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: executas/clip-studio/dist/clipstudio-engine-windows-x86_64.zip*

  release:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Consolidate distribution files
        run: |
          mkdir -p release-assets
          find dist-all -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: "ClipStudio AI v0.2.0 (Multi-Platform Binaries)"
          body: |
            Official multi-platform Executa binaries for ClipStudio AI on Anna AI OS.
            Includes:
            - `clipstudio-engine-linux-x86_64.tar.gz` (Anna Cloud Agent / Linux x64)
            - `clipstudio-engine-darwin-arm64.tar.gz` (macOS Apple Silicon)
            - `clipstudio-engine-darwin-x86_64.tar.gz` (macOS Intel)
            - `clipstudio-engine-windows-x86_64.zip` (Windows x64)
          files: release-assets/*
